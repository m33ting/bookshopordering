
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Shop Ordering System</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f7f8fc;
    color: #222;
  }
  h1 { margin: 0 0 10px; }
  p { margin-bottom: 16px; }

  .top-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }
  #searchBar {
    flex: 1;
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 20px;
    align-items: start;
  }

  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .book-btn {
    padding: 14px;
    background: #4a6cf7;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
  }
  .book-btn:hover { background: #2f49c9; }

  #cart {
    position: sticky;
    top: 20px;
    padding: 18px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    min-height: 180px;
  }
  #cart h2 { margin-top: 0; }
  #cartList {
    max-height: 360px;
    overflow-y: auto;
    padding-left: 22px;
  }
  #total {
    font-weight: bold;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #ddd;
  }
  #clearOrder {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
  }
  #clearOrder:hover { background: #c0392b; }

  #recentOrders {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #ddd;
  }
  #recentOrders h3 { margin: 0 0 8px; font-size: 16px; }
  #recentList {
    max-height: 180px;
    overflow-y: auto;
    padding-left: 20px;
    margin: 0;
  }
  .recent-order { margin-bottom: 8px; font-size: 13px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    #cart { position: static; }
  }
</style>
</head>
<body>

<h1>Book Shop Ordering System</h1>

<div class="top-bar">
  <input id="searchBar" type="search" placeholder="Search for a book..." oninput="filterBooks()">
</div>

<div class="layout">
  <main>
    <p>Select books to add them to your order:</p>

    <div class="book-grid">
      <button class="book-btn" data-title="The Parent Agency" onclick="addBook('The Parent Agency', 7.99)">The Parent Agency (£7.99)</button>
      <button class="book-btn" data-title="Virtually Christmas" onclick="addBook('Virtually Christmas', 6.99)">Virtually Christmas (£6.99)</button>
      <button class="book-btn" data-title="The Magic Faraway Tree" onclick="addBook('The Magic Faraway Tree', 5.99)">The Magic Faraway Tree (£5.99)</button>
      <button class="book-btn" data-title="The Midnight Gang" onclick="addBook('The Midnight Gang', 8.99)">The Midnight Gang (£8.99)</button>
      <button class="book-btn" data-title="Spaceboy" onclick="addBook('Spaceboy', 9.99)">Spaceboy (£9.99)</button>
      <button class="book-btn" data-title="The Ice Monster" onclick="addBook('The Ice Monster', 10.99)">The Ice Monster (£10.99)</button>
      <button class="book-btn" data-title="Isadora Moon Puts on a Show" onclick="addBook('Isadora Moon Puts on a Show', 4.99)">Isadora Moon Puts on a Show (£4.99)</button>
      <button class="book-btn" data-title="Isadora Moon Goes to Ballet" onclick="addBook('Isadora Moon Goes to Ballet', 4.99)">Isadora Moon Goes to Ballet (£4.99)</button>
      <button class="book-btn" data-title="Isadora Moon Has a Sleepover" onclick="addBook('Isadora Moon Has a Sleepover', 4.99)">Isadora Moon Has a Sleepover (£4.99)</button>
      <button class="book-btn" data-title="Isadora Moon Goes to a Wedding" onclick="addBook('Isadora Moon Goes to a Wedding', 4.99)">Isadora Moon Goes to a Wedding (£4.99)</button>
      <button class="book-btn" data-title="Space Band" onclick="addBook('Space Band', 7.99)">Space Band (£7.99)</button>
      <button class="book-btn" data-title="The Christmasaurus and the Naughty List" onclick="addBook('The Christmasaurus and the Naughty List', 8.99)">The Christmasaurus and the Naughty List (£8.99)</button>
      <button class="book-btn" data-title="The Monkey Who Fell from Space" onclick="addBook('The Monkey Who Fell from Space', 6.99)">The Monkey Who Fell from Space (£6.99)</button>
      <button class="book-btn" data-title="Somerset Tsunami" onclick="addBook('Somerset Tsunami', 6.99)">Somerset Tsunami (£6.99)</button>
      <button class="book-btn" data-title="Laura Marlin Mystery #1" onclick="addBook('Laura Marlin Mystery #1', 5.99)">Laura Marlin Mystery #1 (£5.99)</button>
      <button class="book-btn" data-title="Laura Marlin Mystery #2" onclick="addBook('Laura Marlin Mystery #2', 5.99)">Laura Marlin Mystery #2 (£5.99)</button>
      <button class="book-btn" data-title="Father Christmas and Me" onclick="addBook('Father Christmas and Me', 7.99)">Father Christmas and Me (£7.99)</button>
      <button class="book-btn" data-title="Hotel Flamingo: Frosty Fiesta" onclick="addBook('Hotel Flamingo: Frosty Fiesta', 6.99)">Hotel Flamingo: Frosty Fiesta (£6.99)</button>
      <button class="book-btn" data-title="Hotel Flamingo: Carnival Caper" onclick="addBook('Hotel Flamingo: Carnival Caper', 6.99)">Hotel Flamingo: Carnival Caper (£6.99)</button>
      <button class="book-btn" data-title="Hotel Flamingo: Fabulous Feast" onclick="addBook('Hotel Flamingo: Fabulous Feast', 6.99)">Hotel Flamingo: Fabulous Feast (£6.99)</button>
      <button class="book-btn" data-title="Hotel Flamingo: Holiday Heatwave" onclick="addBook('Hotel Flamingo: Holiday Heatwave', 6.99)">Hotel Flamingo: Holiday Heatwave (£6.99)</button>
    </div>
  </main>

  <aside id="cart">
    <h2>Your Order</h2>
    <ul id="cartList"></ul>
    <div id="total">Total: £0.00</div>
    <button id="clearOrder" onclick="clearOrder()">Clear Order</button>

    <div id="recentOrders">
      <h3>Recent Orders</h3>
      <ul id="recentList"></ul>
    </div>
  </aside>
</div>

<script>
  let total = 0;
  let currentOrder = [];

  function addBook(title, price) {
    const list = document.getElementById('cartList');
    const item = document.createElement('li');
    item.textContent = `${title} — £${price.toFixed(2)}`;
    list.appendChild(item);

    currentOrder.push({ title, price });
    total += price;
    document.getElementById('total').textContent = `Total: £${total.toFixed(2)}`;
  }

  function clearOrder() {
    if (currentOrder.length > 0) {
      const recentList = document.getElementById('recentList');
      const order = document.createElement('li');
      order.className = 'recent-order';
      order.textContent = `${currentOrder.length} book(s) — £${total.toFixed(2)}`;
      recentList.prepend(order);
    }

    currentOrder = [];
    total = 0;
    document.getElementById('cartList').innerHTML = '';
    document.getElementById('total').textContent = 'Total: £0.00';
  }

  function filterBooks() {
    const query = document.getElementById('searchBar').value.toLowerCase().trim();
    document.querySelectorAll('.book-btn').forEach(button => {
      const title = button.dataset.title.toLowerCase();
      button.style.display = title.includes(query) ? '' : 'none';
    });
  }
</script>

</body>
</html>
