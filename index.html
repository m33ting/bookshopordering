<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Shop Ordering System</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  h1 { margin-bottom: 10px; }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .book-btn {
    padding: 14px;
    background: #4a6cf7;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
  }
  .book-btn:hover {
    background: #2f49c9;
  }
  #cart {
    margin-top: 20px;
    padding: 15px;
    background: #f4f4f4;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h1>Book Shop Ordering System</h1>

<p>Select books to add them to your order:</p>

<div class="book-grid">
  <button class="book-btn" onclick="addBook('The Parent Agency')">The Parent Agency</button>
  <button class="book-btn" onclick="addBook('Virtually Christmas')">Virtually Christmas</button>
  <button class="book-btn" onclick="addBook('The Magic Faraway Tree')">The Magic Faraway Tree</button>
  <button class="book-btn" onclick="addBook('The Midnight Gang')">The Midnight Gang</button>
  <button class="book-btn" onclick="addBook('Spaceboy')">Spaceboy</button>
  <button class="book-btn" onclick="addBook('The Ice Monster')">The Ice Monster</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Puts on a Show')">Isadora Moon Puts on a Show</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Goes to Ballet')">Isadora Moon Goes to Ballet</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Has a Sleepover')">Isadora Moon Has a Sleepover</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Goes to a Wedding')">Isadora Moon Goes to a Wedding</button>
  <button class="book-btn" onclick="addBook('Space Band')">Space Band</button>
  <button class="book-btn" onclick="addBook('The Christmasaurus and the Naughty List')">The Christmasaurus and the Naughty List</button>
  <button class="book-btn" onclick="addBook('The Monkey Who Fell from Space')">The Monkey Who Fell from Space</button>
  <button class="book-btn" onclick="addBook('Somerset Tsunami')">Somerset Tsunami</button>
  <button class="book-btn" onclick="addBook('Laura Marlin Mystery #1')">Laura Marlin Mystery #1</button>
  <button class="book-btn" onclick="addBook('Laura Marlin Mystery #2')">Laura Marlin Mystery #2</button>
  <button class="book-btn" onclick="addBook('Father Christmas and Me')">Father Christmas and Me</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Frosty Fiesta')">Hotel Flamingo: Frosty Fiesta</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Carnival Caper')">Hotel Flamingo: Carnival Caper</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Fabulous Feast')">Hotel Flamingo: Fabulous Feast</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Holiday Heatwave')">Hotel Flamingo: Holiday Heatwave</button>
</div>

<div id="cart">
  <h2>Your Order</h2>
  <ul id="cartList"></ul>
</div>

<script>
  function addBook(title) {
    const list = document.getElementById('cartList');
    const item = document.createElement('li');
    item.textContent = title;
    list.appendChild(item);
  }
</script>

</body>
</html>
