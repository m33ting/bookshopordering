<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Shop Ordering System</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  h1 { margin-bottom: 10px; }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .book-btn {
    padding: 14px;
    background: #4a6cf7;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
  }
  .book-btn:hover {
    background: #2f49c9;
  }
  #cart {
    margin-top: 20px;
    padding: 15px;
    background: #f4f4f4;
    border-radius: 8px;
  }
  #total {
    font-weight: bold;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Book Shop Ordering System</h1>

<p>Select books to add them to your order:</p>

<div class="book-grid">
  <button class="book-btn" onclick="addBook('The Parent Agency', 7.99)">The Parent Agency (£7.99)</button>
  <button class="book-btn" onclick="addBook('Virtually Christmas', 6.99)">Virtually Christmas (£6.99)</button>
  <button class="book-btn" onclick="addBook('The Magic Faraway Tree', 5.99)">The Magic Faraway Tree (£5.99)</button>
  <button class="book-btn" onclick="addBook('The Midnight Gang', 8.99)">The Midnight Gang (£8.99)</button>
  <button class="book-btn" onclick="addBook('Spaceboy', 9.99)">Spaceboy (£9.99)</button>
  <button class="book-btn" onclick="addBook('The Ice Monster', 10.99)">The Ice Monster (£10.99)</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Puts on a Show', 4.99)">Isadora Moon Puts on a Show (£4.99)</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Goes to Ballet', 4.99)">Isadora Moon Goes to Ballet (£4.99)</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Has a Sleepover', 4.99)">Isadora Moon Has a Sleepover (£4.99)</button>
  <button class="book-btn" onclick="addBook('Isadora Moon Goes to a Wedding', 4.99)">Isadora Moon Goes to a Wedding (£4.99)</button>
  <button class="book-btn" onclick="addBook('Space Band', 7.99)">Space Band (£7.99)</button>
  <button class="book-btn" onclick="addBook('The Christmasaurus and the Naughty List', 8.99)">The Christmasaurus and the Naughty List (£8.99)</button>
  <button class="book-btn" onclick="addBook('The Monkey Who Fell from Space', 6.99)">The Monkey Who Fell from Space (£6.99)</button>
  <button class="book-btn" onclick="addBook('Somerset Tsunami', 6.99)">Somerset Tsunami (£6.99)</button>
  <button class="book-btn" onclick="addBook('Laura Marlin Mystery #1', 5.99)">Laura Marlin Mystery #1 (£5.99)</button>
  <button class="book-btn" onclick="addBook('Laura Marlin Mystery #2', 5.99)">Laura Marlin Mystery #2 (£5.99)</button>
  <button class="book-btn" onclick="addBook('Father Christmas and Me', 7.99)">Father Christmas and Me (£7.99)</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Frosty Fiesta', 6.99)">Hotel Flamingo: Frosty Fiesta (£6.99)</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Carnival Caper', 6.99)">Hotel Flamingo: Carnival Caper (£6.99)</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Fabulous Feast', 6.99)">Hotel Flamingo: Fabulous Feast (£6.99)</button>
  <button class="book-btn" onclick="addBook('Hotel Flamingo: Holiday Heatwave', 6.99)">Hotel Flamingo: Holiday Heatwave (£6.99)</button>
</div>

<div id="cart">
  <h2>Your Order</h2>
  <ul id="cartList"></ul>
  <div id="total">Total: £0.00</div>
</div>

<script>
  let total = 0;

  function addBook(title, price) {
    const list = document.getElementById('cartList');
    const item = document.createElement('li');
    item.textContent = `${title} — £${price.toFixed(2)}`;
    list.appendChild(item);

    total += price;
    document.getElementById('total').textContent = `Total: £${total.toFixed(2)}`;
  }
</script>

</body>
</html>
