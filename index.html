<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Book Shop Scanner (Final Version)</title>

<!-- Modern Quagga2 -->
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>
  body { font-family: Arial; padding: 20px; background:#f7f7ff; }
  h1 { margin-bottom: 10px; }

  /* Small camera preview */
  #scanner {
    width: 180px;
    height: 140px;
    border: 3px solid #333;
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  button { cursor:pointer; margin-right:10px; }

  #cartBox {
    background:white; padding:20px; border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1); margin-top:20px;
  }

  .cart-item { display:flex; justify-content:space-between; margin:8px 0; }
  .qty-btn { padding:4px 10px; margin:0 5px; }
  .remove-btn {
    background:#ff4d4d; color:white; border:none;
    padding:5px 10px; border-radius:5px; cursor:pointer;
  }

  #manualAdd, #checkout {
    margin-top:20px; padding:15px; background:#e8e8ff; border-radius:10px;
  }

  input { padding:8px; width:100%; margin-bottom:10px; }

  #total { font-weight:bold; margin-top:20px; font-size:18px; }
</style>
</head>
<body>

<h1>Book Shop Scanner</h1>

<div id="scanner"></div>
<button onclick="startScanner()">Start Scanner</button>
<button onclick="newOrder()">New Order</button>
<button onclick="loadRecentOrder()">Load Recent Order</button>

<audio id="beep">
  <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<div id="cartBox">
  <h2>Your Cart</h2>
  <div id="cart"></div>
  <div id="total">Total: £0.00</div>
</div>

<div id="manualAdd">
  <h2>Add Book Manually</h2>
  <input id="manualName" placeholder="Book Name">
  <input id="manualPrice" type="number" step="0.01" placeholder="Price (£)">
  <button onclick="addManualBook()">Add to Cart</button>
</div>

<div id="checkout">
  <h2>Checkout</h2>
  <input id="name" placeholder="Your Name">
  <button onclick="placeOrder()">Place Order</button>
</div>

<script>
let cart = {};
let total = 0;

/* All your books */
const books = {
    "9780008460971": { title: "America: The 1960s", price: 8.99 },
    "9780008164664": { title: "The Midnight Gang", price: 8.99 },
    "9780571339266": { title: "Somerset Tsunami", price: 6.99 },
    "9780007279067": { title: "Mr Stink", price: 6.99 },
    "9781786890719": { title: "Father Christmas and Me", price: 7.99 },
    "9780007554485": { title: "The Parent Agency", price: 7.99 },
    "9780008584412": { title: "Virtually Christmas", price: 6.99 },
    "9781444952247": { title: "The Magic Faraway Tree", price: 5.99 },
    "9780008467197": { title: "Spaceboy", price: 9.99 },
    "9780008164706": { title: "The Ice Monster", price: 10.99 },
    "9780192777188": { title: "Isadora Moon Puts on a Show", price: 4.99 },
    "9780192744371": { title: "Isadora Moon Goes to Ballet", price: 4.99 },
    "9780192767110": { title: "Isadora Moon Has a Sleepover", price: 4.99 },
    "9780192779533": { title: "Isadora Moon Goes to a Wedding", price: 4.99 },
    "9780241595916": { title: "Space Band", price: 7.99 },
    "9780241407479": { title: "The Christmasaurus and the Naughty List", price: 8.99 },
    "9780008544744": { title: "The Monkey Who Fell from Space", price: 6.99 },
    "9781444014136": { title: "Laura Marlin Mystery #1", price: 5.99 },
    "9781835587091": { title: "Hotel Flamingo: Frosty Fiesta", price: 6.99 },
    "9781848128071": { title: "Hotel Flamingo: Carnival Caper", price: 6.99 },
    "9781848128392": { title: "Hotel Flamingo: Fabulous Feast", price: 6.99 },
    "9781848128057": { title: "Hotel Flamingo: Holiday Heatwave", price: 6.99 }
};

/* Back camera only */
function startScanner() {
  Quagga.stop();

  Quagga.init({
    inputStream: {
      type: "LiveStream",
      constraints: {
        facingMode: { ideal: "environment" },   // FORCE BACK CAMERA ONLY
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      target: document.querySelector('#scanner')
    },
    decoder: { readers: ["ean_reader"] }
  }, err => {
    if (err) {
      alert("Camera failed. Run on localhost and allow camera access.");
      console.error(err);
      return;
    }
    Quagga.start();
  });

  Quagga.onDetected(data => {
    const code = data.codeResult.code;
    document.getElementById("beep").play();

    if (books[code]) addBook(code);
    else alert("Unknown barcode: " + code);
  });
}

/* Add scanned book */
function addBook(code) {
  const book = books[code];
  if (!cart[code]) cart[code] = { ...book, qty: 1 };
  else cart[code].qty++;

  saveCart();
  updateCart();
}

/* Manual book entry */
function addManualBook() {
  const name = manualName.value.trim();
  const price = parseFloat(manualPrice.value);

  if (!name || isNaN(price)) return alert("Enter valid name + price");

  const code = "manual_" + name.toLowerCase().replace(/\s+/g, "_");

  if (!cart[code]) cart[code] = { title: name, price, qty: 1 };
  else cart[code].qty++;

  manualName.value = "";
  manualPrice.value = "";

  saveCart();
  updateCart();
}

/* Update cart display */
function updateCart() {
  cartDiv.innerHTML = "";
  total = 0;

  for (const code in cart) {
    const item = cart[code];
    total += item.qty * item.price;

    const row = document.createElement("div");
    row.className = "cart-item";

    row.innerHTML = `
      <span>${item.title} (£${item.price.toFixed(2)})</span>
      <span>
        <button class="qty-btn" onclick="changeQty('${code}', -1)">-</button>
        ${item.qty}
        <button class="qty-btn" onclick="changeQty('${code}', 1)">+</button>
        <button class="remove-btn" onclick="removeItem('${code}')">Remove</button>
      </span>
    `;

    cartDiv.appendChild(row);
  }

  totalDiv.textContent = `Total: £${total.toFixed(2)}`;
}

/* Change quantity */
function changeQty(code, amount) {
  cart[code].qty += amount;
  if (cart[code].qty <= 0) delete cart[code];
  saveCart();
  updateCart();
}

/* Remove item */
function removeItem(code) {
  delete cart[code];
  saveCart();
  updateCart();
}

/* Checkout */
function placeOrder() {
  const name = document.getElementById("name").value.trim();
  if (!name) return alert("Enter your name");
  alert("Order saved for " + name);
}

/* Save cart */
function saveCart() {
  localStorage.setItem("bookCart", JSON.stringify(cart));
}

/* Load recent order */
function loadRecentOrder() {
  const saved = localStorage.getItem("bookCart");
  if (!saved) {
    alert("No recent order found.");
    return;
  }

  cart = JSON.parse(saved);
  updateCart();
  alert("Recent order loaded!");
}

/* New order */
function newOrder() {
  cart = {};
  saveCart();
  updateCart();
  alert("New order started!");
}

/* Load cart on startup */
function loadCart() {
  const saved = localStorage.getItem("bookCart");
  if (saved) {
    cart = JSON.parse(saved);
    updateCart();
  }
}

loadCart();
</script>

</body>
</html>
